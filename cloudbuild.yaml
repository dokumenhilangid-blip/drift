# Cloud Build configuration for Drift.
# Cloud Run UI auto-uses this when "Build type: Dockerfile" is selected,
# but providing it explicitly gives stable, reproducible builds.
#
# Submit (UI does this automatically on every push):
#   gcloud builds submit --config cloudbuild.yaml

steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - build
      - --tag=$_IMAGE
      - --cache-from=$_IMAGE:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .
    env:
      - DOCKER_BUILDKIT=1

  # 2. Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args: [push, $_IMAGE]
    waitFor: [build]

substitutions:
  _IMAGE: gcr.io/$PROJECT_ID/drift:$SHORT_SHA

images:
  - $_IMAGE

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
